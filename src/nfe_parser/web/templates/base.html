<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Início{% endblock %} · NF-e Despesas</title>
  <link rel="icon" href="data:,">{# sem icone: evita o pedido de /favicon.ico, que daria 404 #}
  <script src="/static/htmx.min.js" defer></script>
  {% block cabeca %}{% endblock %}
  <style>
    :root {
      --fundo: #f6f7f9; --superficie: #ffffff; --texto: #1d2330; --suave: #5b6577;
      --borda: #dde1e7; --destaque: #2f6fdb; --ok: #1f8a4c; --ruim: #c0392b;
      --aviso-fundo: #fff4d6; --aviso-texto: #7a5300;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #14171d; --superficie: #1c2028; --texto: #e6e9ef; --suave: #9aa3b2;
        --borda: #2e3440; --destaque: #6d9cf0; --ok: #4cc283; --ruim: #ef7a6d;
        --aviso-fundo: #3a2f12; --aviso-texto: #f3cf73;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fundo); color: var(--texto);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--superficie); border-bottom: 1px solid var(--borda); }
    nav { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px;
          flex-wrap: wrap; align-items: center; }
    nav a { color: var(--suave); text-decoration: none; padding: 14px 10px; }
    nav a:hover { color: var(--texto); }
    nav a.marca { color: var(--texto); font-weight: 700; margin-right: 12px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    h2 { font-size: 1.1rem; margin: 28px 0 10px; }
    a { color: var(--destaque); }
    .caixa { background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px;
             padding: 16px; }
    .tabela-rolavel { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--superficie);
            border: 1px solid var(--borda); border-radius: 8px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--borda);
             vertical-align: middle; }
    th { color: var(--suave); font-weight: 600; font-size: .85rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .suave { color: var(--suave); font-size: .9rem; }
    .selo { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem;
            border: 1px solid var(--borda); color: var(--suave); white-space: nowrap; }
    .selo.ok { color: var(--ok); border-color: var(--ok); }
    .selo.ruim { color: var(--ruim); border-color: var(--ruim); }
    .selo.devolvido { color: var(--destaque); border-color: var(--destaque); }
    .aviso { background: var(--aviso-fundo); color: var(--aviso-texto); border: 0; }
    .erro { background: var(--aviso-fundo); color: var(--aviso-texto); padding: 10px 14px;
            border-radius: 8px; margin-bottom: 16px; }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
               gap: 10px; }
    .cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px;
              padding: 12px; }
    .cartao b { display: block; font-size: 1.4rem; }
    form.linha { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--suave); }
    input, select, button { font: inherit; padding: 6px 10px; border-radius: 6px;
                            border: 1px solid var(--borda); background: var(--superficie);
                            color: var(--texto); }
    button { cursor: pointer; background: var(--destaque); color: #fff; border-color: var(--destaque); }
    button.discreto { background: transparent; color: var(--destaque); }
    button.perigo { background: transparent; color: var(--ruim); border-color: var(--ruim); }
    .paginacao { display: flex; gap: 12px; margin-top: 12px; align-items: center; }
    {% block estilo %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="marca" href="/">NF-e Despesas</a>
      <a href="/">Importar</a>
      <a href="/notas">Notas</a>
      <a href="/revisar">Revisar</a>
      <a href="/orcamento">Orçamento</a>
      <a href="/relatorios">Relatórios</a>
      <a href="/taxonomia">Taxonomia</a>
    </nav>
  </header>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
