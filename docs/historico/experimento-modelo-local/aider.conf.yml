# Config do Aider — copiada para a RAIZ do projeto pelo bootstrap.
# Este arquivo E versionado (ver .gitignore.fragment: as linhas com "!").
#
# Validado na Fase 0 (2026-09-04): o `test-cmd` abaixo foi invocado pelo Aider
# em todos os runs, e ele leu o codigo de saida corretamente (0 = passou).

# Formato de edicao. `diff` = blocos SEARCH/REPLACE (o padrao).
# Para REORGANIZAR (mover/reordenar linhas) em arquivo de ate ~120 linhas,
# passe `--edit-format whole` na invocacao. NUNCA use `udiff` (falha em silencio).
# Medicao que sustenta isso: fase0-resultados.md, secao 9.
edit-format: diff

# O Aider roda o test-cmd apos cada edicao e realimenta a falha no modelo,
# sozinho, sem custo de Claude. E o passo 3 do loop de 4 passos.
# ATENCAO: o teto do Aider e 3 reflexoes. Nao converge em 3 -> a tarefa era grande demais.
auto-test: true

# Python, nao PowerShell: independe do shell e e legivel por quem mantem o projeto.
# O `verify` e o juiz de toda a arquitetura — precisa ser auditavel pelo dono.
test-cmd: python scripts/verify.py

# O mapa do repo custa orcamento fixo dos 8192 tokens. Mantido enxuto de proposito;
# prefira `/add` explicito em 1-3 arquivos a confiar no mapa.
map-tokens: 1024

# Commits do modelo local ficam distinguiveis dos do par com Claude.
# So funciona se a autoria tiver sido configurada — ver bootstrap.md, portao 4.
auto-commits: true
